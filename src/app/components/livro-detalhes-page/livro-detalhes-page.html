<div class="pagina-detalhes">
  @if (livro) {
    <div class="detalhes-container">
      <div class="detalhes-header">
        <h1 class="detalhes-titulo">📖 Detalhes do Livro</h1>
      </div>

      <div class="detalhes-conteudo">
        <div class="livro-secao">
          <h2 class="livro-titulo">{{ livro.titulo }}</h2>
          <p class="livro-autor">
            <span class="label">Autor:</span>
            <span class="valor">{{ livro.autor }}</span>
          </p>
          <p class="livro-ano">
            <span class="label">Ano de publicação:</span>
            <span class="valor">{{ livro.anoPublicacao }}</span>
          </p>
        </div>
      </div>

      <div class="detalhes-acoes">
        <button class="btn-voltar" routerLink="/livros">← Voltar para lista</button>
      </div>
    </div>
  } @else {
    <div class="detalhes-container">
      <div class="mensagem-erro">
        <h1 class="erro-titulo">⚠️ Livro não encontrado</h1>
        <p class="erro-descricao">O livro solicitado não existe ou foi removido.</p>
        <button class="btn-voltar" routerLink="/livros">← Voltar para lista</button>
      </div>
    </div>
  }
</div>
